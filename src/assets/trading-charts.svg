<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#203a43"/>
      <stop offset="100%" style="stop-color:#2c5364"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6b4f;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecca3"/>
    </linearGradient>
    <linearGradient id="fill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6b4f;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1f6b4f;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>
  <!-- Price area fill -->
  <path d="M0 360 L100 320 L200 300 L300 260 L400 280 L500 220 L600 200 L700 160 L800 180 L900 140 L1000 120 L1100 100 L1200 80 L1200 480 L0 480 Z" fill="url(#fill1)"/>
  <!-- Price line -->
  <path d="M0 360 L100 320 L200 300 L300 260 L400 280 L500 220 L600 200 L700 160 L800 180 L900 140 L1000 120 L1100 100 L1200 80" fill="none" stroke="url(#line1)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Candlesticks -->
  <g fill="none">
    <rect x="80" y="310" width="16" height="30" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="180" y="290" width="16" height="25" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="280" y="255" width="16" height="28" rx="2" fill="#ff6b6b" opacity="0.7"/>
    <rect x="380" y="275" width="16" height="22" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="480" y="215" width="16" height="30" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="580" y="195" width="16" height="25" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="680" y="155" width="16" height="28" rx="2" fill="#ff6b6b" opacity="0.7"/>
    <rect x="780" y="175" width="16" height="22" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="880" y="135" width="16" height="25" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="980" y="115" width="16" height="20" rx="2" fill="#4ecca3" opacity="0.7"/>
    <rect x="1080" y="95" width="16" height="22" rx="2" fill="#4ecca3" opacity="0.7"/>
  </g>
  <!-- Labels -->
  <text x="60" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">MAY</text>
  <text x="260" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">JUL</text>
  <text x="460" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">SEP</text>
  <text x="660" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">NOV</text>
  <text x="860" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">JAN</text>
  <text x="1060" y="450" font-family="monospace" font-size="13" fill="#4ecca3" opacity="0.6">MAR</text>
  <!-- Price labels -->
  <text x="1150" y="85" font-family="monospace" font-size="12" fill="#4ecca3" text-anchor="end">$0.82</text>
  <text x="1150" y="145" font-family="monospace" font-size="12" fill="#4ecca3" text-anchor="end">$0.70</text>
  <text x="1150" y="205" font-family="monospace" font-size="12" fill="#4ecca3" text-anchor="end">$0.58</text>
  <text x="1150" y="265" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.3" text-anchor="end">$0.46</text>
</svg>
