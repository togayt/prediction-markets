<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f2e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1f4e"/>
      <stop offset="100%" style="stop-color:#1e1635"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Calculator body -->
  <rect x="60" y="50" width="240" height="300" rx="16" fill="url(#calcGrad)" stroke="#4c1d95" stroke-width="1.5"/>
  <!-- Display -->
  <rect x="78" y="70" width="204" height="60" rx="8" fill="#0a0f1e"/>
  <text x="270" y="100" text-anchor="end" fill="#a78bfa" font-family="monospace" font-size="22" font-weight="bold">$7.00</text>
  <text x="270" y="118" text-anchor="end" fill="#4c1d95" font-family="monospace" font-size="11">fee on $100 trade</text>
  <!-- Buttons -->
  <rect x="78" y="142" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="100" y="166" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">7</text>
  <rect x="130" y="142" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="152" y="166" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">8</text>
  <rect x="182" y="142" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="204" y="166" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">9</text>
  <rect x="234" y="142" width="44" height="36" rx="6" fill="#6d28d9"/>
  <text x="256" y="166" text-anchor="middle" fill="#ede9fe" font-family="monospace" font-size="16">%</text>
  <rect x="78" y="186" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="100" y="210" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">4</text>
  <rect x="130" y="186" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="152" y="210" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">5</text>
  <rect x="182" y="186" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="204" y="210" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">6</text>
  <rect x="234" y="186" width="44" height="36" rx="6" fill="#6d28d9"/>
  <text x="256" y="210" text-anchor="middle" fill="#ede9fe" font-family="monospace" font-size="16">x</text>
  <rect x="78" y="230" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="100" y="254" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">1</text>
  <rect x="130" y="230" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="152" y="254" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">2</text>
  <rect x="182" y="230" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="204" y="254" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">3</text>
  <rect x="234" y="230" width="44" height="36" rx="6" fill="#6d28d9"/>
  <text x="256" y="254" text-anchor="middle" fill="#ede9fe" font-family="monospace" font-size="16">-</text>
  <rect x="78" y="274" width="96" height="36" rx="6" fill="#3b1d6e"/>
  <text x="126" y="298" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">0</text>
  <rect x="182" y="274" width="44" height="36" rx="6" fill="#3b1d6e"/>
  <text x="204" y="298" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="14">.</text>
  <rect x="234" y="274" width="44" height="36" rx="6" fill="#7c3aed"/>
  <text x="256" y="298" text-anchor="middle" fill="#ede9fe" font-family="monospace" font-size="16">+</text>
  <!-- Fee comparison (right) -->
  <text x="380" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="bold">Fee Comparison</text>
  <text x="380" y="100" fill="#64748b" font-family="monospace" font-size="11">per $100 trade</text>
  <!-- Bars -->
  <text x="380" y="140" fill="#94a3b8" font-family="sans-serif" font-size="13">Kalshi</text>
  <rect x="460" y="125" width="196" height="24" rx="4" fill="#1e3a5f" opacity="0.5"/>
  <rect x="460" y="125" width="196" height="24" rx="4" fill="#3b82f6" opacity="0.7"/>
  <text x="665" y="143" fill="#93c5fd" font-family="monospace" font-size="12">~$7.00</text>
  <text x="380" y="185" fill="#94a3b8" font-family="sans-serif" font-size="13">Polymarket</text>
  <rect x="460" y="170" width="56" height="24" rx="4" fill="#10b981" opacity="0.8"/>
  <rect x="460" y="170" width="200" height="24" rx="4" fill="#1e3a5f" opacity="0.3"/>
  <text x="665" y="188" fill="#6ee7b7" font-family="monospace" font-size="12">~$2.00</text>
  <text x="380" y="230" fill="#94a3b8" font-family="sans-serif" font-size="13">Crypto.com</text>
  <rect x="460" y="215" width="84" height="24" rx="4" fill="#a78bfa" opacity="0.8"/>
  <rect x="460" y="215" width="200" height="24" rx="4" fill="#1e3a5f" opacity="0.3"/>
  <text x="665" y="233" fill="#c4b5fd" font-family="monospace" font-size="12">~$3.00</text>
  <!-- Note -->
  <rect x="370" y="280" width="370" height="60" rx="8" fill="#1e1635" stroke="#4c1d95" stroke-width="1"/>
  <text x="555" y="306" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold">Fees matter most for frequent traders</text>
  <text x="555" y="326" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Lower fees = more profit on winning positions</text>
  <text x="180" y="370" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">FEE CALCULATOR</text>
  <text x="555" y="370" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">PLATFORM FEE COMPARISON</text>
</svg>
