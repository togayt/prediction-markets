<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1a0533"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#3a35a0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <!-- Glow halos -->
  <circle cx="600" cy="240" r="120" fill="#6c63ff" opacity="0.06" filter="url(#blur)"/>
  <circle cx="200" cy="150" r="60" fill="#4ecca3" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1000" cy="320" r="80" fill="#6c63ff" opacity="0.07" filter="url(#blur)"/>
  <!-- Connection lines -->
  <g stroke="#6c63ff" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <line x1="200" y1="150" x2="600" y2="240"/>
    <line x1="200" y1="150" x2="380" y2="350"/>
    <line x1="600" y1="240" x2="380" y2="350"/>
    <line x1="600" y1="240" x2="820" y2="130"/>
    <line x1="600" y1="240" x2="1000" y2="320"/>
    <line x1="820" y1="130" x2="1000" y2="320"/>
    <line x1="380" y1="350" x2="700" y2="400"/>
    <line x1="1000" y1="320" x2="700" y2="400"/>
    <line x1="820" y1="130" x2="1050" y2="100"/>
    <line x1="200" y1="150" x2="100" y2="300"/>
    <line x1="100" y1="300" x2="380" y2="350"/>
    <line x1="1050" y1="100" x2="1000" y2="320"/>
  </g>
  <!-- Animated-look dashed lines -->
  <g stroke="#4ecca3" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6,4">
    <line x1="600" y1="240" x2="100" y2="300"/>
    <line x1="600" y1="240" x2="700" y2="400"/>
    <line x1="600" y1="240" x2="1050" y2="100"/>
  </g>
  <!-- Nodes -->
  <circle cx="600" cy="240" r="28" fill="url(#node)" filter="url(#softglow)"/>
  <circle cx="600" cy="240" r="34" fill="none" stroke="#6c63ff" stroke-width="1.5" opacity="0.5"/>
  <text x="600" y="245" font-family="monospace" font-size="13" fill="white" text-anchor="middle" font-weight="bold">PM</text>
  <circle cx="200" cy="150" r="18" fill="url(#node)" opacity="0.85"/>
  <circle cx="380" cy="350" r="16" fill="url(#node)" opacity="0.8"/>
  <circle cx="820" cy="130" r="20" fill="url(#node)" opacity="0.85"/>
  <circle cx="1000" cy="320" r="18" fill="url(#node)" opacity="0.8"/>
  <circle cx="700" cy="400" r="14" fill="url(#node)" opacity="0.75"/>
  <circle cx="100" cy="300" r="12" fill="#4ecca3" opacity="0.7"/>
  <circle cx="1050" cy="100" r="12" fill="#4ecca3" opacity="0.7"/>
  <!-- Block labels -->
  <text x="820" y="125" font-family="monospace" font-size="10" fill="#4ecca3" text-anchor="middle" opacity="0.8">POLY</text>
  <text x="200" y="145" font-family="monospace" font-size="10" fill="#4ecca3" text-anchor="middle" opacity="0.8">ETH</text>
  <text x="1000" y="315" font-family="monospace" font-size="10" fill="#4ecca3" text-anchor="middle" opacity="0.8">USDC</text>
  <!-- Small particles -->
  <circle cx="420" cy="195" r="3" fill="#4ecca3" opacity="0.6"/>
  <circle cx="700" cy="185" r="3" fill="#6c63ff" opacity="0.7"/>
  <circle cx="490" cy="295" r="2.5" fill="#4ecca3" opacity="0.5"/>
  <circle cx="900" cy="220" r="3" fill="#6c63ff" opacity="0.6"/>
</svg>
