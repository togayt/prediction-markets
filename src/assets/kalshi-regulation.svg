<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6b4f"/>
      <stop offset="100%" style="stop-color:#0f3d2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <!-- Stars background -->
  <circle cx="100" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="250" cy="30" r="1" fill="white" opacity="0.3"/>
  <circle cx="400" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="550" cy="20" r="1" fill="white" opacity="0.3"/>
  <circle cx="700" cy="70" r="2" fill="white" opacity="0.4"/>
  <circle cx="850" cy="40" r="1" fill="white" opacity="0.3"/>
  <circle cx="1000" cy="55" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1150" cy="25" r="1" fill="white" opacity="0.4"/>
  <!-- Building columns -->
  <rect x="340" y="180" width="520" height="20" rx="4" fill="#1f6b4f" opacity="0.9"/>
  <rect x="360" y="380" width="480" height="16" rx="3" fill="#1f6b4f" opacity="0.7"/>
  <!-- Steps -->
  <rect x="300" y="396" width="600" height="14" rx="3" fill="#1f6b4f" opacity="0.6"/>
  <rect x="260" y="410" width="680" height="14" rx="3" fill="#1f6b4f" opacity="0.5"/>
  <!-- Columns -->
  <rect x="380" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <rect x="460" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <rect x="540" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <rect x="620" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <rect x="700" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <rect x="780" y="200" width="28" height="180" rx="4" fill="#245e47" opacity="0.85"/>
  <!-- Pediment / triangle top -->
  <polygon points="600,80 850,180 350,180" fill="#1a4a35" opacity="0.9"/>
  <polygon points="600,100 830,180 370,180" fill="#1f6b4f" opacity="0.5"/>
  <!-- Scales of justice icon (center) -->
  <line x1="600" y1="110" x2="600" y2="160" stroke="#4ecca3" stroke-width="3"/>
  <line x1="550" y1="130" x2="650" y2="130" stroke="#4ecca3" stroke-width="2"/>
  <circle cx="550" cy="148" r="12" fill="none" stroke="#4ecca3" stroke-width="2"/>
  <circle cx="650" cy="140" r="12" fill="none" stroke="#4ecca3" stroke-width="2"/>
  <!-- CFTC badge -->
  <rect x="480" y="295" width="240" height="60" rx="8" fill="#0f2a1e" stroke="#1f6b4f" stroke-width="1.5"/>
  <text x="600" y="322" font-family="Georgia, serif" font-size="14" fill="#4ecca3" text-anchor="middle" letter-spacing="3">CFTC REGULATED</text>
  <text x="600" y="344" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.5" text-anchor="middle">COMMODITY FUTURES TRADING COMMISSION</text>
  <!-- Glow at top -->
  <ellipse cx="600" cy="180" rx="200" ry="20" fill="#1f6b4f" opacity="0.15"/>
</svg>
