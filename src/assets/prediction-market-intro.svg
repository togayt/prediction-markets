<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="100" y1="60" x2="700" y2="60" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="120" x2="700" y2="120" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="180" x2="700" y2="180" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="240" x2="700" y2="240" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="300" x2="700" y2="300" stroke="#334155" stroke-width="1"/>
  <!-- YES bar -->
  <rect x="170" y="120" width="140" height="180" rx="6" fill="url(#bar1)" opacity="0.9"/>
  <text x="240" y="110" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="16" font-weight="bold">YES</text>
  <text x="240" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">67%</text>
  <!-- NO bar -->
  <rect x="490" y="210" width="140" height="90" rx="6" fill="url(#bar2)" opacity="0.9"/>
  <text x="560" y="200" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="16" font-weight="bold">NO</text>
  <text x="560" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">33%</text>
  <!-- Question label -->
  <rect x="150" y="345" width="500" height="32" rx="6" fill="#1e3a5f" opacity="0.7"/>
  <text x="400" y="366" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">Will inflation fall below 3% by year end?</text>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">PREDICTION MARKET</text>
</svg>
