<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a0c"/>
      <stop offset="100%" style="stop-color:#0f2a1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Chess board (left) -->
  <g transform="translate(60, 60)">
    <!-- Board squares 6x6 -->
    <rect x="0" y="0" width="240" height="240" rx="4" fill="#1a2e1a"/>
    <!-- Dark squares -->
    <rect x="0" y="0" width="40" height="40" fill="#2d4a2d"/>
    <rect x="80" y="0" width="40" height="40" fill="#2d4a2d"/>
    <rect x="160" y="0" width="40" height="40" fill="#2d4a2d"/>
    <rect x="40" y="40" width="40" height="40" fill="#2d4a2d"/>
    <rect x="120" y="40" width="40" height="40" fill="#2d4a2d"/>
    <rect x="200" y="40" width="40" height="40" fill="#2d4a2d"/>
    <rect x="0" y="80" width="40" height="40" fill="#2d4a2d"/>
    <rect x="80" y="80" width="40" height="40" fill="#2d4a2d"/>
    <rect x="160" y="80" width="40" height="40" fill="#2d4a2d"/>
    <rect x="40" y="120" width="40" height="40" fill="#2d4a2d"/>
    <rect x="120" y="120" width="40" height="40" fill="#2d4a2d"/>
    <rect x="200" y="120" width="40" height="40" fill="#2d4a2d"/>
    <rect x="0" y="160" width="40" height="40" fill="#2d4a2d"/>
    <rect x="80" y="160" width="40" height="40" fill="#2d4a2d"/>
    <rect x="160" y="160" width="40" height="40" fill="#2d4a2d"/>
    <rect x="40" y="200" width="40" height="40" fill="#2d4a2d"/>
    <rect x="120" y="200" width="40" height="40" fill="#2d4a2d"/>
    <rect x="200" y="200" width="40" height="40" fill="#2d4a2d"/>
    <!-- King piece (simplified) -->
    <rect x="95" y="95" width="30" height="30" rx="4" fill="#22c55e"/>
    <text x="110" y="116" text-anchor="middle" fill="#0f2a1a" font-size="18">♛</text>
    <!-- Move arrow -->
    <line x1="110" y1="110" x2="150" y2="70" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="150,60 145,75 158,72" fill="#22c55e"/>
  </g>
  <!-- Strategy tips (right) -->
  <text x="370" y="80" fill="#22c55e" font-family="sans-serif" font-size="18" font-weight="bold">Trading Strategies</text>
  <!-- Tip 1 -->
  <circle cx="382" cy="125" r="14" fill="#14532d"/>
  <text x="382" y="130" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">1</text>
  <text x="406" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Fade the crowd</text>
  <text x="406" y="140" fill="#64748b" font-family="sans-serif" font-size="12">Markets overreact to news</text>
  <!-- Tip 2 -->
  <circle cx="382" cy="175" r="14" fill="#14532d"/>
  <text x="382" y="180" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">2</text>
  <text x="406" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Kelly sizing</text>
  <text x="406" y="190" fill="#64748b" font-family="sans-serif" font-size="12">Bet proportional to your edge</text>
  <!-- Tip 3 -->
  <circle cx="382" cy="225" r="14" fill="#14532d"/>
  <text x="382" y="230" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">3</text>
  <text x="406" y="222" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Diversify markets</text>
  <text x="406" y="240" fill="#64748b" font-family="sans-serif" font-size="12">Spread risk across events</text>
  <!-- Tip 4 -->
  <circle cx="382" cy="275" r="14" fill="#14532d"/>
  <text x="382" y="280" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">4</text>
  <text x="406" y="272" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Track your record</text>
  <text x="406" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Log trades to find patterns</text>
  <!-- Edge badge -->
  <rect x="370" y="325" width="380" height="40" rx="8" fill="#14532d" opacity="0.7"/>
  <text x="560" y="351" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="12">Edge = (p x win) - ((1-p) x loss)</text>
  <text x="150" y="335" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">BEGINNER STRATEGIES</text>
</svg>
