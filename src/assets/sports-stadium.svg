<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="60%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4731"/>
      <stop offset="100%" style="stop-color:#0d2e1e"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fffbe6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <!-- Stadium structure -->
  <ellipse cx="600" cy="480" rx="580" ry="180" fill="#0d1f30" opacity="0.9"/>
  <ellipse cx="600" cy="480" rx="500" ry="150" fill="#0f2a1e" opacity="0.95"/>
  <!-- Field -->
  <ellipse cx="600" cy="460" rx="380" ry="110" fill="url(#field)"/>
  <!-- Field lines -->
  <ellipse cx="600" cy="460" rx="380" ry="110" fill="none" stroke="#2d7a4a" stroke-width="2"/>
  <ellipse cx="600" cy="460" rx="250" ry="72" fill="none" stroke="#2d7a4a" stroke-width="1.5"/>
  <ellipse cx="600" cy="460" rx="120" ry="35" fill="none" stroke="#2d7a4a" stroke-width="1.5"/>
  <line x1="600" y1="350" x2="600" y2="480" stroke="#2d7a4a" stroke-width="1.5"/>
  <circle cx="600" cy="460" r="10" fill="none" stroke="#2d7a4a" stroke-width="1.5"/>
  <!-- Floodlights -->
  <rect x="100" y="120" width="8" height="120" fill="#8899aa" opacity="0.7"/>
  <rect x="80" y="100" width="48" height="14" rx="2" fill="#8899aa" opacity="0.7"/>
  <ellipse cx="104" cy="107" rx="40" ry="30" fill="url(#light)" opacity="0.4"/>
  <rect x="1092" y="120" width="8" height="120" fill="#8899aa" opacity="0.7"/>
  <rect x="1072" y="100" width="48" height="14" rx="2" fill="#8899aa" opacity="0.7"/>
  <ellipse cx="1096" cy="107" rx="40" ry="30" fill="url(#light)" opacity="0.4"/>
  <!-- Stadium seating tiers -->
  <path d="M220 370 Q600 200 980 370" fill="none" stroke="#1e3a5a" stroke-width="40" opacity="0.7"/>
  <path d="M240 380 Q600 220 960 380" fill="none" stroke="#162d47" stroke-width="25" opacity="0.6"/>
  <!-- Crowd dots -->
  <g fill="#4488cc" opacity="0.4">
    <circle cx="300" cy="340" r="3"/><circle cx="340" cy="330" r="2.5"/><circle cx="380" cy="320" r="3"/>
    <circle cx="420" cy="310" r="2.5"/><circle cx="460" cy="302" r="3"/><circle cx="500" cy="295" r="2.5"/>
    <circle cx="540" cy="290" r="3"/><circle cx="580" cy="287" r="2.5"/><circle cx="620" cy="287" r="3"/>
    <circle cx="660" cy="290" r="2.5"/><circle cx="700" cy="295" r="3"/><circle cx="740" cy="302" r="2.5"/>
    <circle cx="780" cy="310" r="3"/><circle cx="820" cy="320" r="2.5"/><circle cx="860" cy="330" r="3"/>
    <circle cx="900" cy="340" r="2.5"/>
  </g>
  <!-- Score overlay -->
  <rect x="460" y="130" width="280" height="80" rx="10" fill="#000000" opacity="0.6"/>
  <rect x="460" y="130" width="280" height="80" rx="10" fill="none" stroke="#1f6b4f" stroke-width="1.5"/>
  <text x="540" y="175" font-family="monospace" font-size="36" fill="#4ecca3" font-weight="bold">62¢</text>
  <text x="740" y="175" font-family="monospace" font-size="36" fill="#ff6b6b" font-weight="bold">41¢</text>
  <text x="600" y="155" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.4" text-anchor="middle" letter-spacing="2">MARKET ODDS</text>
  <line x1="665" y1="145" x2="665" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
</svg>
