  <text x="320" y="222" text-anchor="end" fill="#22d3ee" font-family="monospace" font-size="13">~7% taker</text>
  <rect x="60" y="242" width="280" height="36" rx="6" fill="#0e3a4f" opacity="0.6"/>
  <text x="90" y="266" fill="#94a3b8" font-family="sans-serif" font-size="13">Currency</text>
  <text x="320" y="266" text-anchor="end" fill="#22d3ee" font-family="monospace" font-size="13">USD</text>
  <rect x="60" y="286" width="280" height="36" rx="6" fill="#0e3a4f" opacity="0.8"/>
