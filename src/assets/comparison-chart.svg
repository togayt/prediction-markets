  <text x="200" y="90" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">US-regulated</text>
  <!-- Kalshi attributes -->
  <rect x="60" y="110" width="280" height="36" rx="6" fill="#0e3a4f" opacity="0.8"/>
