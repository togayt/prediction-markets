  <text x="600" y="65" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="22" font-weight="bold">Polymarket</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">crypto-based</text>
  <!-- Polymarket attributes -->
  <rect x="460" y="110" width="280" height="36" rx="6" fill="#2d1a4f" opacity="0.8"/>
  <text x="490" y="134" fill="#94a3b8" font-family="sans-serif" font-size="13">Regulated by CFTC</text>
  <text x="720" y="134" text-anchor="end" fill="#f87171" font-family="monospace" font-size="13">No</text>
  <rect x="460" y="154" width="280" height="36" rx="6" fill="#2d1a4f" opacity="0.6"/>
  <text x="490" y="178" fill="#94a3b8" font-family="sans-serif" font-size="13">Available in US</text>
  <text x="720" y="178" text-anchor="end" fill="#f87171" font-family="monospace" font-size="13">No</text>
  <rect x="460" y="198" width="280" height="36" rx="6" fill="#2d1a4f" opacity="0.8"/>
  <text x="490" y="222" fill="#94a3b8" font-family="sans-serif" font-size="13">Market fees</text>
  <text x="720" y="222" text-anchor="end" fill="#a78bfa" font-family="monospace" font-size="13">~2% taker</text>
  <rect x="460" y="242" width="280" height="36" rx="6" fill="#2d1a4f" opacity="0.6"/>
  <text x="490" y="266" fill="#94a3b8" font-family="sans-serif" font-size="13">Currency</text>
  <text x="720" y="266" text-anchor="end" fill="#a78bfa" font-family="monospace" font-size="13">USDC</text>
