<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0f1428"/>
    </linearGradient>
    <radialGradient id="btcGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </radialGradient>
    <radialGradient id="ethGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </radialGradient>
    <radialGradient id="usdcGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Connection lines -->
  <line x1="160" y1="200" x2="400" y2="200" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="200" x2="640" y2="120" stroke="#2d1f4e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="200" x2="640" y2="280" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="200" x2="560" y2="200" stroke="#1a3a1f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Bitcoin node -->
  <circle cx="160" cy="200" r="55" fill="url(#btcGrad)" opacity="0.15"/>
  <circle cx="160" cy="200" r="44" fill="#1a0f00" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="196" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="24" font-weight="bold">₿</text>
  <text x="160" y="216" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11">BTC</text>
  <!-- USDC/Polygon hub -->
  <circle cx="400" cy="200" r="50" fill="url(#usdcGrad)" opacity="0.2"/>
  <circle cx="400" cy="200" r="40" fill="#0a1628" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold">USDC</text>
  <text x="400" y="215" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="10">Polygon</text>
  <!-- Ethereum node -->
  <circle cx="640" cy="120" r="40" fill="#1a1428" stroke="#6366f1" stroke-width="2"/>
  <text x="640" y="115" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="20" font-weight="bold">Ξ</text>
  <text x="640" y="133" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="11">ETH</text>
  <!-- DeFi node -->
  <circle cx="640" cy="280" r="40" fill="#0a1a0f" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="275" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">DeFi</text>
  <text x="640" y="293" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Oracle</text>
  <!-- Market node -->
  <rect x="560" y="180" width="80" height="40" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="197" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold">Market</text>
  <text x="600" y="213" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10">AMM</text>
  <!-- Labels -->
  <text x="400" y="355" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11" letter-spacing="1">CRYPTO PREDICTION MARKET INFRASTRUCTURE</text>
  <!-- Fee note -->
  <text x="400" y="380" text-anchor="middle" fill="#334155" font-family="monospace" font-size="11">Gas fees: fractions of a cent on Polygon L2</text>
</svg>
