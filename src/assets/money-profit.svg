<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2040"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Coin stack -->
  <ellipse cx="160" cy="300" rx="60" ry="18" fill="#92400e"/>
  <ellipse cx="160" cy="286" rx="60" ry="18" fill="url(#coinGrad)"/>
  <rect x="100" y="240" width="120" height="46" fill="#d97706"/>
  <ellipse cx="160" cy="240" rx="60" ry="18" fill="url(#coinGrad)"/>
  <text x="160" y="247" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="18" font-weight="bold">$</text>
  <rect x="100" y="194" width="120" height="46" fill="#f59e0b"/>
  <ellipse cx="160" cy="194" rx="60" ry="18" fill="url(#coinGrad)"/>
  <text x="160" y="201" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="18" font-weight="bold">$</text>
  <!-- Flow arrows -->
  <path d="M 260 240 Q 340 200 420 200" stroke="url(#flowGrad)" stroke-width="3" fill="none" stroke-dasharray="6,3"/>
  <polygon points="415,193 430,200 415,207" fill="#10b981"/>
  <!-- Revenue streams box -->
  <rect x="430" y="100" width="310" height="220" rx="10" fill="#0f2a3a" stroke="#1e4a6a" stroke-width="1"/>
  <text x="585" y="130" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">How Platforms Make Money</text>
  <!-- Fees row -->
  <rect x="450" y="145" width="270" height="34" rx="5" fill="#0a3a4f" opacity="0.8"/>
  <text x="465" y="168" fill="#94a3b8" font-family="sans-serif" font-size="13">Trading fees</text>
  <text x="700" y="168" text-anchor="end" fill="#22c55e" font-family="monospace" font-size="13">2-7%</text>
  <!-- Spread row -->
  <rect x="450" y="186" width="270" height="34" rx="5" fill="#0a3a4f" opacity="0.6"/>
  <text x="465" y="209" fill="#94a3b8" font-family="sans-serif" font-size="13">Bid-ask spread</text>
  <text x="700" y="209" text-anchor="end" fill="#22c55e" font-family="monospace" font-size="13">varies</text>
  <!-- Affiliate row -->
  <rect x="450" y="227" width="270" height="34" rx="5" fill="#0a3a4f" opacity="0.8"/>
  <text x="465" y="250" fill="#94a3b8" font-family="sans-serif" font-size="13">Affiliate programs</text>
  <text x="700" y="250" text-anchor="end" fill="#fbbf24" font-family="monospace" font-size="13">CPA / RevShare</text>
  <!-- Resolution row -->
  <rect x="450" y="268" width="270" height="34" rx="5" fill="#0a3a4f" opacity="0.6"/>
  <text x="465" y="291" fill="#94a3b8" font-family="sans-serif" font-size="13">Resolution float</text>
  <text x="700" y="291" text-anchor="end" fill="#22c55e" font-family="monospace" font-size="13">interest</text>
  <!-- Bottom label -->
  <text x="160" y="365" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">PLATFORM REVENUE</text>
  <text x="585" y="365" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">MONETIZATION MODEL</text>
</svg>
