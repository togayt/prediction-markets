name: Daily UK ILR Change Check

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print extra debug output"
        required: false
        default: "false"

jobs:
  check-ilr-policy:
    name: Check UK ILR qualifying period (5 → 10 years?)
    runs-on: ubuntu-latest
    permissions:
      issues: write   # needed to open the alert issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ILR change check
        id: ilr_check
        # Exit code 0 → no change; 1 → possible change detected; 2 → script error
        run: node scripts/check-ilr-change.mjs
        continue-on-error: true

      - name: Open GitHub issue if change detected
        if: steps.ilr_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split("T")[0];
            const title = `🚨 [${today}] UK ILR qualifying period change signal detected`;
            const body = [
              "## ILR Policy Change Alert",
              "",
              "The daily monitor script detected signals that the UK ILR qualifying period",
              "**may have changed from 5 years to 10 years**.",
              "",
              "### What to do",
              "1. Check [gov.uk – Indefinite leave to remain](https://www.gov.uk/indefinite-leave-to-remain)",
              "2. Check [gov.uk – Long residence](https://www.gov.uk/long-residence)",
              "3. Check [gov.uk – Skilled Worker – settlement](https://www.gov.uk/skilled-worker-visa/settlement)",
              "4. Search for recent Home Office announcements on the change.",
              "5. Update the prediction market event page at `/events/uk-ilr-time-change` with confirmed details.",
              "6. Close this issue once confirmed or ruled out.",
              "",
              `> Auto-opened by the \`check-uk-ilr-change\` workflow on ${today}.`,
            ].join("\n");

            // Check if an open alert issue already exists today to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ilr-monitor",
            });

            const alreadyOpen = issues.some(i => i.title.includes(today));
            if (alreadyOpen) {
              console.log("Alert issue for today already exists — skipping creation.");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ilr-monitor", "policy-change", "needs-review"],
            });

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.ilr_check.outcome }}" = "success" ]; then
            echo "### ✅ No ILR change detected" >> $GITHUB_STEP_SUMMARY
            echo "The 5-year qualifying period appears unchanged on gov.uk." >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚨 Possible ILR change detected" >> $GITHUB_STEP_SUMMARY
            echo "A GitHub issue has been opened for manual review." >> $GITHUB_STEP_SUMMARY
          fi
